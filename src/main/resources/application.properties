spring.application.name=ridebooking
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.expiration-ms=86400000
matching.max-radius-km=5

jwt.expiration-ms=86400000

fare.base=50
fare.per-km=12
fare.per-minute=1.5
fare.minimum=80
fare.surge-multiplier=1.0
fare.road-factor=1.3
fare.avg-speed-kmh=30

matching.max-radius-km=5

stripe.secret-key=
stripe.webhook-secret=
stripe.currency=inr
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
rate-limit.login-max-failures=5
rate-limit.login-window-minutes=15
rate-limit.api-max-requests=120
rate-limit.api-window-seconds=60
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# cache
spring.cache.type=caffeine
spring.cache.cache-names=driverRatings
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s

# connection pool (Supabase's pooler has limited connections: more is not faster)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# batch inserts and updates when a transaction saves many rows
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# smaller JSON responses
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json

spring.jpa.open-in-view=false